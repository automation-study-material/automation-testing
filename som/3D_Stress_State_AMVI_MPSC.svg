<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#c62828"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ef6c00"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6a1b9a"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#ffffff}
      .subtitle{font:600 20px Arial,sans-serif;fill:#123}
      .label{font:700 22px Arial,sans-serif}
      .small{font:18px Arial,sans-serif;fill:#263238}
      .tiny{font:16px Arial,sans-serif;fill:#263238}
      .box{fill:#f7fbff;stroke:#90caf9;stroke-width:2}
      .face1{fill:#e3f2fd;stroke:#455a64;stroke-width:3}
      .face2{fill:#bbdefb;stroke:#455a64;stroke-width:3}
      .face3{fill:#90caf9;stroke:#455a64;stroke-width:3}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="62" fill="#0d4775"/>
  <text x="35" y="42" class="title">2B–2C. 3-D Stress State &amp; Stress Tensor</text>

  <!-- Main cube -->
  <rect x="25" y="85" width="720" height="400" rx="14" class="box"/>
  <text x="55" y="125" class="subtitle">A small element inside a loaded 3-D body</text>

  <!-- Cube geometry -->
  <polygon points="245,205 470,205 545,260 320,260" class="face1"/>
  <polygon points="245,205 320,260 320,430 245,375" class="face2"/>
  <polygon points="320,260 545,260 545,430 320,430" class="face3"/>

  <!-- Hidden-ish edges -->
  <line x1="245" y1="375" x2="320" y2="430" stroke="#607d8b" stroke-width="3" stroke-dasharray="8,7"/>
  <line x1="245" y1="205" x2="245" y2="375" stroke="#455a64" stroke-width="3"/>

  <!-- Axes -->
  <line x1="320" y1="430" x2="180" y2="535" stroke="#c62828" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="145" y="555" class="label" fill="#c62828">x</text>
  <line x1="545" y1="430" x2="670" y2="430" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="680" y="438" class="label" fill="#2e7d32">y</text>
  <line x1="320" y1="260" x2="320" y2="135" stroke="#1565c0" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="308" y="118" class="label" fill="#1565c0">z</text>

  <!-- Normal stresses -->
  <line x1="320" y1="260" x2="320" y2="165" stroke="#1565c0" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="335" y="170" class="label" fill="#1565c0">σz</text>
  <line x1="545" y1="340" x2="650" y2="340" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="585" y="325" class="label" fill="#2e7d32">σy</text>
  <line x1="245" y1="375" x2="150" y2="445" stroke="#c62828" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="115" y="465" class="label" fill="#c62828">σx</text>

  <!-- Shear stresses on visible faces -->
  <line x1="430" y1="260" x2="500" y2="260" stroke="#ef6c00" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="455" y="245" class="label" fill="#ef6c00">τxy</text>
  <line x1="420" y1="430" x2="490" y2="430" stroke="#6a1b9a" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="450" y="465" class="label" fill="#6a1b9a">τyx</text>
  <line x1="545" y1="300" x2="545" y2="365" stroke="#ef6c00" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="560" y="335" class="label" fill="#ef6c00">τyz</text>
  <line x1="320" y1="315" x2="320" y2="375" stroke="#6a1b9a" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="335" y="355" class="label" fill="#6a1b9a">τzy</text>

  <!-- Face meaning -->
  <rect x="55" y="395" width="650" height="70" rx="10" fill="#fff8e1" stroke="#ffcc80" stroke-width="2"/>
  <text x="75" y="423" class="small"><tspan font-weight="700">Face normals:</tspan> x-face ⟂ x-axis, y-face ⟂ y-axis, z-face ⟂ z-axis</text>
  <text x="75" y="450" class="small">Normal stress ⟂ face • Shear stress ∥ face</text>

  <!-- Tensor panel -->
  <rect x="770" y="85" width="405" height="400" rx="14" class="box"/>
  <text x="800" y="125" class="subtitle">3 × 3 Stress Tensor Matrix</text>
  <text x="800" y="155" class="small">Diagonal = normal • Off-diagonal = shear</text>

  <!-- Matrix -->
  <text x="805" y="230" font-size="46" font-family="Georgia,serif" fill="#263238">[</text>
  <text x="850" y="200" font-size="25" font-family="Georgia,serif" fill="#c62828">σx</text>
  <text x="940" y="200" font-size="25" font-family="Georgia,serif" fill="#6a1b9a">τxy</text>
  <text x="1030" y="200" font-size="25" font-family="Georgia,serif" fill="#6a1b9a">τxz</text>
  <text x="850" y="245" font-size="25" font-family="Georgia,serif" fill="#6a1b9a">τyx</text>
  <text x="940" y="245" font-size="25" font-family="Georgia,serif" fill="#c62828">σy</text>
  <text x="1030" y="245" font-size="25" font-family="Georgia,serif" fill="#6a1b9a">τyz</text>
  <text x="850" y="290" font-size="25" font-family="Georgia,serif" fill="#6a1b9a">τzx</text>
  <text x="940" y="290" font-size="25" font-family="Georgia,serif" fill="#6a1b9a">τzy</text>
  <text x="1030" y="290" font-size="25" font-family="Georgia,serif" fill="#c62828">σz</text>
  <text x="1090" y="230" font-size="46" font-family="Georgia,serif" fill="#263238">]</text>

  <rect x="800" y="320" width="340" height="65" rx="9" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
  <text x="820" y="348" class="small" font-weight="700">3 normal components</text>
  <text x="820" y="373" class="small">σx, σy, σz</text>

  <rect x="800" y="398" width="340" height="65" rx="9" fill="#f3e5f5" stroke="#ba68c8" stroke-width="2"/>
  <text x="820" y="426" class="small" font-weight="700">6 shear entries = 3 pairs</text>
  <text x="820" y="451" class="small">τxy=τyx, τxz=τzx, τyz=τzy</text>

  <!-- Bottom explanation -->
  <rect x="25" y="510" width="1150" height="270" rx="14" fill="#fafafa" stroke="#b0bec5" stroke-width="2"/>
  <text x="55" y="550" class="subtitle">How to read the 3-D stress state</text>

  <text x="60" y="590" class="small"><tspan font-weight="700" fill="#c62828">σx</tspan> → normal stress on the x-face / x-direction component</text>
  <text x="60" y="625" class="small"><tspan font-weight="700" fill="#2e7d32">σy</tspan> → normal stress on the y-face / y-direction component</text>
  <text x="60" y="660" class="small"><tspan font-weight="700" fill="#1565c0">σz</tspan> → normal stress on the z-face / z-direction component</text>

  <text x="600" y="590" class="small"><tspan font-weight="700" fill="#6a1b9a">τxy, τxz</tspan> → shear components associated with the x-face</text>
  <text x="600" y="625" class="small"><tspan font-weight="700" fill="#6a1b9a">τyx, τyz</tspan> → shear components associated with the y-face</text>
  <text x="600" y="660" class="small"><tspan font-weight="700" fill="#6a1b9a">τzx, τzy</tspan> → shear components associated with the z-face</text>

  <rect x="55" y="695" width="1090" height="55" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
  <text x="80" y="730" font-size="21" font-family="Arial,sans-serif" fill="#5d4037">
    <tspan font-weight="700">AMVI shortcut:</tspan> 3-D stress tensor = 3 normal + 3 independent shear = 6 independent components.
  </text>
</svg>